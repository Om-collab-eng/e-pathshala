services:
  - type: web
    name: librika-web
    env: node
    region: oregon
    plan: free
    buildCommand: "npm install"
    startCommand: "node server_new.js"
    envVars:
      - key: NODE_VERSION
        value: 20.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: librika-storage
          property: connectionString
      - key: CLOUDINARY_CLOUD_NAME
        value: azwohkqu
      - key: CLOUDINARY_API_KEY
        value: "613621954564511"
      - key: CLOUDINARY_API_SECRET
        value: wwvKpb1qQs_fEbalCsCYa4bU-EY
      - key: INIT_DB
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
