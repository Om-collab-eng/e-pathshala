database:
  name: librika-storage
  plan: free

services:
  # 1. Main Backend (Python Flask App)
  - type: web
    name: librika-backend
    env: docker
    dockerContext: .
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: librika-storage
          property: connectionString
      - key: CLOUDINARY_CLOUD_NAME
        value: azwohkqu
      - key: CLOUDINARY_API_KEY
        value: "613621954564511"
      - key: CLOUDINARY_API_SECRET
        value: wwvKpb1qQs_fEbalCsCYa4bU-EY
      - key: INIT_DB
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: NVIDIA_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false

  # 2. OCR Scanner System (Node.js App)
  - type: web
    name: ocr-scanner
    env: docker
    dockerContext: ocr-scanner-system
    dockerfilePath: ocr-scanner-system/Dockerfile
    plan: free
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
