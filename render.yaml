databases:
  - name: librika-storage
    plan: free

services:
  # Main Node.js Backend Application
  - type: web
    name: librika-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node app.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: librika-storage
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: CLOUDINARY_CLOUD_NAME
        value: azwohkqu
      - key: CLOUDINARY_API_KEY
        value: "613621954564511"
      - key: CLOUDINARY_API_SECRET
        value: wwvKpb1qQs_fEbalCsCYa4bU-EY
