{% extends "base.html" %}

{% block title %}Join - librika.in{% endblock %}

{% block content %}
<div class="login-container">
    <div class="auth-card">
        <h1>Join Digital Library</h1>
        <p>Choose your account type and register</p>
        
        <form method="POST" enctype="multipart/form-data">
            <div class="input-group">
                <label for="account_type">Account Type</label>
                <select id="account_type" name="account_type" style="width: 100%; padding: 0.8rem 1rem; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-input); color: var(--text-high); font-size: 0.95rem;" onchange="toggleAccountType()">
                    <option value="school">School Library (Link as Student)</option>
                    <option value="personal">Personal Library (Private Collection Owner)</option>
                </select>
            </div>

            <!-- Common name field -->
            <div class="input-group">
                <label id="lbl_name" for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="John Doe" required>
            </div>

            <!-- School specific fields -->
            <div id="schoolFields">
                <div class="input-group">
                    <label for="school_code">Library Code</label>
                    <input type="text" id="school_code" name="school_code" placeholder="DL-XXXXXX" required>
                </div>
            </div>

            <!-- Personal specific fields -->
            <div id="personalFields" style="display: none;">
                <div class="input-group">
                    <label for="library_name">Library Name</label>
                    <input type="text" id="library_name" name="library_name" placeholder="My Cozy Home Library">
                </div>
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="john@example.com">
                </div>
                <div class="input-group">
                    <label for="profile_photo">Profile Photo (Optional)</label>
                    <input type="file" id="profile_photo" name="profile_photo" accept="image/*" style="border: none; padding: 0.5rem 0; color: var(--text-mid);">
                </div>
            </div>

            <!-- Common credentials -->
            <div class="input-group">
                <label for="phone">Phone Number (Login ID)</label>
                <input type="text" id="phone" name="phone" placeholder="9876543210" required>
            </div>
            <div class="input-group">
                <label for="password">Security Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="btn-neon">Register Account</button>
            
            <p style="margin-top: 2rem; margin-bottom: 0; text-align: center;">
                Already have an account? <a href="/login" style="color: var(--accent-primary); font-weight: 700; text-decoration: none;">Global Login</a>
            </p>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function toggleAccountType() {
    const type = document.getElementById('account_type').value;
    const schoolFields = document.getElementById('schoolFields');
    const personalFields = document.getElementById('personalFields');
    const libraryNameInput = document.getElementById('library_name');
    const emailInput = document.getElementById('email');
    const schoolCodeInput = document.getElementById('school_code');
    const nameLabel = document.getElementById('lbl_name');
    
    if (type === 'personal') {
        schoolFields.style.display = 'none';
        personalFields.style.display = 'block';
        
        libraryNameInput.required = true;
        emailInput.required = true;
        schoolCodeInput.required = false;
        
        nameLabel.innerText = "Owner Name";
    } else {
        schoolFields.style.display = 'block';
        personalFields.style.display = 'none';
        
        libraryNameInput.required = false;
        emailInput.required = false;
        schoolCodeInput.required = true;
        
        nameLabel.innerText = "Full Name";
    }
}
document.addEventListener('DOMContentLoaded', toggleAccountType);
</script>
{% endblock %}
