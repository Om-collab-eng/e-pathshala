events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log;

    sendfile        on;
    keepalive_timeout  65;

    # 1. Main Application Proxy: librika.in -> librika-backend:5001
    server {
        listen 80;
        server_name librika.in www.librika.in;

        client_max_body_size 50M;

        location / {
            proxy_pass http://librika-backend:5001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120;
            proxy_connect_timeout 120;
        }
    }

    # 2. OCR Scanner Proxy: ocr.librika.in -> ocr-scanner:5002
    server {
        listen 80;
        server_name ocr.librika.in;

        client_max_body_size 20M;

        location / {
            proxy_pass http://ocr-scanner:5002;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120;
            proxy_connect_timeout 120;
        }
    }
}
