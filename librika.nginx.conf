# ============================================================
# Librika Nginx Configuration for Domain: librika.in
# Place this file in /etc/nginx/sites-available/librika
# ============================================================

server {
    listen 80;
    server_name librika.in www.librika.in;

    client_max_body_size 50M;

    # 1. OCR Scanner Frontend route (Mapped to /ocr/)
    location /ocr/ {
        proxy_pass http://127.0.0.1:5002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. OCR Scanner API routes (Redirected to OCR scanner backend)
    location /api/scan {
        proxy_pass http://127.0.0.1:5002/api/scan;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/books {
        proxy_pass http://127.0.0.1:5002/api/books;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/stats {
        proxy_pass http://127.0.0.1:5002/api/stats;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Main Flask Backend (Catch-all with static asset caching)
    location /static/ {
        alias /var/www/librika/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri @proxy_to_app;
    }

    location / {
        try_files $uri @proxy_to_app;
    }

    location @proxy_to_app {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120;
        proxy_connect_timeout 120;
    }
}
