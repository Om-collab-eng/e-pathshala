# ============================================================
# Librika Nginx Configuration for Domain: librika.in
# Place this file in /etc/nginx/sites-available/librika
# ============================================================

# 1. Main Application: librika.in
server {
    listen 80;
    server_name librika.in www.librika.in;

    client_max_body_size 50M;

    # Serve static files directly from the host if they exist,
    # otherwise fall back to proxying to the docker container.
    location /static/ {
        alias /var/www/librika/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri @proxy_to_app;
    }

    location / {
        try_files $uri @proxy_to_app;
    }

    location @proxy_to_app {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120;
        proxy_connect_timeout 120;
    }
}

# 2. OCR Scanner System: ocr.librika.in
server {
    listen 80;
    server_name ocr.librika.in;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:5002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120;
        proxy_connect_timeout 120;
    }
}
